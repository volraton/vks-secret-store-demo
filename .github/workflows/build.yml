name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Pin deployed image in Git
        run: |
          sed -i "s#ghcr.io/volraton/vks-secret-store-demo:.*#ghcr.io/volraton/vks-secret-store-demo:${GITHUB_SHA}#" k8s/app.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/app.yaml
          git diff --cached --quiet || git commit -m "chore: pin image ${GITHUB_SHA} [skip ci]"
          git push
