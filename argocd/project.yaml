apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: vks-demo
  namespace: argocd
spec:
  description: VKS Secret Store demo project
  sourceRepos:
    - https://github.com/volraton/vks-secret-store-demo.git
  destinations:
    - namespace: demo
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: external-secrets.io
      kind: ExternalSecret
