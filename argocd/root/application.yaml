apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vks-secret-store-demo-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/volraton/vks-secret-store-demo.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
