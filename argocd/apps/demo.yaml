apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vks-secret-store-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: vks-demo
  source:
    repoURL: https://github.com/volraton/vks-secret-store-demo.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
