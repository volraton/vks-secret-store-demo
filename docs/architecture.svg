<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">VCF 9 VKS Secret Store Demo Architecture</title>
<desc id="desc">Block diagram showing GitHub and Argo CD App-of-Apps deploying Flask and PostgreSQL to VKS, VCF Secret Store supplying credentials, and Foundation Load Balancer exposing the Flask application.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker>
  <style>
    .title{font:700 28px Arial,sans-serif;fill:#0f172a}.h{font:700 18px Arial,sans-serif;fill:#0f172a}.t{font:14px Arial,sans-serif;fill:#334155}.small{font:12px Arial,sans-serif;fill:#64748b}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.group{fill:#f8fafc;stroke:#64748b;stroke-width:2}.secret{fill:#fff7ed;stroke:#f59e0b;stroke-width:2}.git{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2}.net{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}.app{fill:#f0fdf4;stroke:#22c55e;stroke-width:2}.arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 6}
  </style>
</defs>
<rect width="1400" height="820" fill="#ffffff"/>
<text x="700" y="48" text-anchor="middle" class="title">VMware Cloud Foundation 9 — VKS Secret Store Demo</text>
<text x="700" y="75" text-anchor="middle" class="small">GitOps + Secret Management + Foundation Load Balancer</text>

<!-- Git -->
<rect x="55" y="125" width="250" height="150" rx="16" class="git"/>
<text x="180" y="158" text-anchor="middle" class="h">GitHub</text>
<text x="180" y="187" text-anchor="middle" class="t">volraton/vks-secret-store-demo</text>
<text x="180" y="215" text-anchor="middle" class="t">App manifests</text>
<text x="180" y="238" text-anchor="middle" class="t">App-of-Apps</text>
<text x="180" y="261" text-anchor="middle" class="t">Container image reference</text>

<!-- Argo -->
<rect x="375" y="125" width="250" height="150" rx="16" class="git"/>
<text x="500" y="158" text-anchor="middle" class="h">Argo CD</text>
<text x="500" y="187" text-anchor="middle" class="t">AppProject: vks-demo</text>
<text x="500" y="211" text-anchor="middle" class="t">Root Application</text>
<text x="500" y="235" text-anchor="middle" class="t">Child Application</text>
<text x="500" y="259" text-anchor="middle" class="t">Self-heal / prune</text>
<path d="M305 200 L375 200" class="arrow"/>
<text x="340" y="188" text-anchor="middle" class="small">GitOps</text>

<!-- VCF boundary -->
<rect x="55" y="330" width="1290" height="430" rx="20" class="group"/>
<text x="80" y="360" class="h">VMware Cloud Foundation 9</text>

<!-- Supervisor -->
<rect x="85" y="390" width="360" height="330" rx="16" class="box"/>
<text x="265" y="423" text-anchor="middle" class="h">vSphere Supervisor</text>
<rect x="115" y="455" width="300" height="105" rx="12" class="secret"/>
<text x="265" y="487" text-anchor="middle" class="h">VCF Secret Store Service</text>
<text x="265" y="514" text-anchor="middle" class="t">OpenBao backend</text>
<text x="265" y="539" text-anchor="middle" class="t">demo-db</text>
<rect x="115" y="585" width="300" height="105" rx="12" class="net"/>
<text x="265" y="617" text-anchor="middle" class="h">Foundation Load Balancer</text>
<text x="265" y="644" text-anchor="middle" class="t">VIP / LoadBalancer service</text>
<text x="265" y="669" text-anchor="middle" class="small">VCF networking foundation</text>

<!-- VKS -->
<rect x="480" y="390" width="820" height="330" rx="16" class="box"/>
<text x="890" y="423" text-anchor="middle" class="h">VKS Workload Cluster</text>
<rect x="510" y="455" width="235" height="100" rx="12" class="git"/>
<text x="627" y="488" text-anchor="middle" class="h">Argo CD</text>
<text x="627" y="514" text-anchor="middle" class="t">Application reconciliation</text>
<text x="627" y="538" text-anchor="middle" class="small">Git → Kubernetes</text>
<rect x="785" y="455" width="235" height="100" rx="12" class="app"/>
<text x="902" y="488" text-anchor="middle" class="h">Flask App</text>
<text x="902" y="514" text-anchor="middle" class="t">secret-demo</text>
<text x="902" y="538" text-anchor="middle" class="small">Service: LoadBalancer</text>
<rect x="1060" y="455" width="210" height="100" rx="12" class="app"/>
<text x="1165" y="488" text-anchor="middle" class="h">PostgreSQL</text>
<text x="1165" y="514" text-anchor="middle" class="t">demo database</text>
<text x="1165" y="538" text-anchor="middle" class="small">Credentials from Secret</text>
<rect x="650" y="600" width="330" height="85" rx="12" class="secret"/>
<text x="815" y="631" text-anchor="middle" class="h">Kubernetes Secret</text>
<text x="815" y="656" text-anchor="middle" class="t">db-credentials</text>
<text x="815" y="676" text-anchor="middle" class="small">generated by secret integration</text>

<!-- arrows -->
<path d="M625 235 C720 270 650 340 650 455" class="arrow dashed"/>
<text x="675" y="310" class="small">sync</text>
<path d="M415 507 L650 642" class="arrow"/>
<text x="500" y="560" class="small">secret</text>
<path d="M650 505 L785 505" class="arrow"/>
<path d="M1020 505 L1060 505" class="arrow"/>
<path d="M815 600 L815 555" class="arrow"/>
<path d="M980 642 C1060 642 1110 590 1160 555" class="arrow dashed"/>
<text x="1060" y="625" class="small">credentials</text>
<path d="M415 637 L510 505" class="arrow"/>
<text x="430" y="590" class="small">VIP / LB</text>

<!-- Client -->
<rect x="1080" y="125" width="250" height="150" rx="16" class="net"/>
<text x="1205" y="158" text-anchor="middle" class="h">Client</text>
<text x="1205" y="187" text-anchor="middle" class="t">Browser / curl</text>
<text x="1205" y="216" text-anchor="middle" class="t">http://&lt;EXTERNAL-IP&gt;</text>
<text x="1205" y="244" text-anchor="middle" class="small">Application entry point</text>
<path d="M1205 275 L300 585" class="arrow dashed"/>
<text x="760" y="420" class="small">Foundation LB VIP</text>

<!-- legend -->
<text x="80" y="795" class="small">Purple = GitOps • Orange = secrets • Green = workloads • Blue = networking / client access</text>
</svg>